services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./etc:/etc/trino:ro
      - ./drivers/postgresql.jar:/usr/lib/trino/plugin/iceberg/postgresql.jar:ro
    depends_on:
      - postgres
      - minio
    networks: [lake]

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    ports:
      - "5432:5432"
    networks: [lake]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:                                          # ← ADD
      - pgdata:/var/lib/postgresql/data              # ← ADD (persist data)
      - ./init:/docker-entrypoint-initdb.d:ro        # ← ADD (auto-run DDL)

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [lake]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    container_name: createbuckets
    depends_on:
      - minio
    networks: [lake]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set myminio http://minio:9000 minio minio123 &&
      mc mb -p myminio/warehouse || true

networks:
  lake: {}

volumes:                                              # ← ADD
  pgdata:                                             # ← ADD
